[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerwise"
version = "0.1.0"
description = "An agent that explains why a settlement does not add up."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic>=2",
  "sqlglot>=25",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["backend*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
